name: Signed build and release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "[0-9]*-*"

permissions:
  contents: write

concurrency:
  group: signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test, sign, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing repository secret $name"; exit 1; }
          done

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK 37
        shell: bash
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/statusbar-force-close-release.p12"

      - name: Test and build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/statusbar-force-close-release.p12
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean testDebugUnitTest lintDebug assembleRelease

      - name: Validate and stage APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          input="app/build/outputs/apk/release/app-release.apk"
          [[ -f "$input" ]] || { echo "::error::Missing signed release APK"; exit 1; }

          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"
          signature_report="$("$apksigner" verify --verbose --print-certs "$input")"
          printf '%s\n' "$signature_report"
          expected_signer="$(tr -d '[:space:]' < SIGNING_CERT_SHA256 | tr '[:upper:]' '[:lower:]')"
          actual_signer="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<<"$signature_report" | head -n1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual_signer" && "$actual_signer" == "$expected_signer" ]] || {
            echo "::error::Release signer does not match SIGNING_CERT_SHA256"; exit 1;
          }

          package_line="$($aapt2 dump badging "$input" | sed -n '1p')"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$package_line")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$package_line")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$package_line")"
          sdk_line="$($aapt2 dump badging "$input" | grep -m1 '^sdkVersion:')"
          target_sdk_line="$($aapt2 dump badging "$input" | grep -m1 '^targetSdkVersion:')"
          application_line="$($aapt2 dump badging "$input" | grep -m1 '^application:')"
          [[ "$package_name" == 'com.wayne.statusbarforceclose' ]] || {
            echo "::error::Unexpected application package"; exit 1;
          }
          [[ "$sdk_line" == "sdkVersion:'37'" ]] || { echo "::error::Unexpected minSdk"; exit 1; }
          [[ "$target_sdk_line" == "targetSdkVersion:'37'" ]] || { echo "::error::Unexpected targetSdk"; exit 1; }
          [[ "$application_line" == *" icon=''"* ]] || {
            echo "::error::APK unexpectedly declares an application icon"; exit 1;
          }

          manifest="$($aapt2 dump xmltree "$input" --file AndroidManifest.xml)"
          for component in activity service receiver provider; do
            if grep -Eq "^[[:space:]]+E: ${component}( |$)" <<<"$manifest"; then
              echo "::error::APK unexpectedly declares an Android $component"; exit 1
            fi
          done
          if grep -Eq '^[[:space:]]+E: uses-permission( |$)' <<<"$manifest"; then
            echo "::error::APK unexpectedly requests an Android permission"; exit 1
          fi
          if unzip -Z1 "$input" | grep -Eq '^lib/'; then
            echo "::error::APK unexpectedly contains native libraries"; exit 1
          fi

          expected_module_prop=$'minApiVersion=102\ntargetApiVersion=102\nstaticScope=true'
          expected_scope='com.android.systemui'
          expected_entry='com.wayne.statusbarforceclose.StatusBarForceCloseModule'
          actual_module_prop="$(unzip -p "$input" META-INF/xposed/module.prop | tr -d '\r')"
          actual_scope="$(unzip -p "$input" META-INF/xposed/scope.list | tr -d '\r')"
          actual_entry="$(unzip -p "$input" META-INF/xposed/java_init.list | tr -d '\r')"
          [[ "$actual_module_prop" == "$expected_module_prop" ]] || {
            echo "::error::Invalid API102 module metadata"; exit 1;
          }
          [[ "$actual_scope" == "$expected_scope" ]] || {
            echo "::error::Unexpected static Xposed scope"; exit 1;
          }
          [[ "$actual_entry" == "$expected_entry" ]] || {
            echo "::error::Unexpected libxposed entry point"; exit 1;
          }
          if unzip -Z1 "$input" | grep -Fxq 'assets/xposed_init'; then
            echo "::error::APK contains the legacy Xposed entry point"; exit 1
          fi

          dex_dir="$RUNNER_TEMP/statusbar-force-close-dex"
          mkdir -p "$dex_dir"
          unzip -qq "$input" 'classes*.dex' -d "$dex_dir"
          if grep -aFRq -e 'event=' -e 'double_tap_detected' "$dex_dir"; then
            echo "::error::Release APK still contains debug diagnostic messages"; exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            expected_tag="${version_code}-${version_name// /_}"
            [[ "$GITHUB_REF_NAME" == "$expected_tag" ]] || {
              echo "::error::Tag '$GITHUB_REF_NAME' must equal APK version '$expected_tag'"; exit 1;
            }
          fi

          mkdir -p dist
          output="$GITHUB_WORKSPACE/dist/StatusBarForceClose-${version_name}.apk"
          cp "$input" "$output"
          (cd dist && sha256sum "$(basename "$output")" > SHA256SUMS)
          echo "apk=$output" >> "$GITHUB_OUTPUT"
          echo "checksum=$GITHUB_WORKSPACE/dist/SHA256SUMS" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed test artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StatusBarForceClose-signed-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.package.outputs.apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != 'true' ]]; then
              echo "::error::Public release $GITHUB_REF_NAME already exists"; exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$CHECKSUM" \
            --verify-tag \
            --draft \
            --title "$VERSION_NAME" \
            --generate-notes

          release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == 'true' ]] || {
            echo "::error::Release left draft state before asset validation"; exit 1;
          }
          expected_assets="$(printf '%s\n' "$(basename "$APK")" "$(basename "$CHECKSUM")" | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo "::error::Draft release assets do not match the expected APK and checksum"; exit 1;
          }
          gh release edit "$GITHUB_REF_NAME" --draft=false
