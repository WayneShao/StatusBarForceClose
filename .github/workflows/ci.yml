name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK 37
        shell: bash
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Test, lint, and build application artifacts
        run: >-
          ./gradlew clean testDebugUnitTest lintDebug
          assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon

      - name: Verify host test results
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          assert reports, "no host test reports found"
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          print(totals)
          assert totals["tests"] > 0
          assert totals["failures"] == 0
          assert totals["errors"] == 0
          PY

      - name: Validate Debug and Release APK contracts
        shell: bash
        run: |
          bash .github/scripts/validate-apk.sh \
            app/build/outputs/apk/debug/app-debug.apk diagnostics-present
          bash .github/scripts/validate-apk.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk diagnostics-absent

      - name: Validate instrumentation package
        shell: bash
        run: |
          set -euo pipefail
          test_apk=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          [[ -f "$test_apk" ]] || { echo "::error::Missing instrumentation APK"; exit 1; }
          manifest="$($ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2 dump xmltree \
            "$test_apk" --file AndroidManifest.xml)"
          grep -Fq 'androidx.test.runner.AndroidJUnitRunner' <<<"$manifest" || {
            echo "::error::Unexpected instrumentation runner"; exit 1;
          }
          grep -Fq 'com.wayne.statusbarforceclose' <<<"$manifest" || {
            echo "::error::Unexpected instrumentation target"; exit 1;
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StatusBarForceClose-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
